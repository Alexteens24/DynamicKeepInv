# DynamicKeepInv — https://github.com/Alexteens24/DynamicKeepInv/wiki
config-version: 11

# =============================================================================
# 1 — Plugin core
# =============================================================================
plugin:
  enabled: true
  debug: false
  # Server ticks between keepInventory checks (20 ticks = 1 second)
  check-interval: 100

# How strings from messages.yml are parsed: legacy (& codes) or minimessage
# (Legacy nested key messages.format is still read if this is blank; this key wins when both are set.)
message-format: legacy

# =============================================================================
# 2 — Schedule (world time 0–23999)
# Each milestone starts a segment [at, next-at) with wrap at 24000.
# keep-items / keep-xp apply while world time is in that segment (before the next milestone).
# announce: if true, players may be notified when entering this segment (see broadcast.period-change).
# =============================================================================
schedule:
  milestones:
    - at: 0
      keep-items: true
      keep-xp: true
      announce: true
    - at: 13000
      keep-items: false
      keep-xp: false
      announce: true

# =============================================================================
# 3 — Death rules (bypass, PvP/PvE, streak, first death — NOT day/night; use schedule.milestones)
# =============================================================================
death-rules:
  bypass-permission: true

  death-cause:
    enabled: false
    pvp:
      keep-items: false
      keep-xp: false
    pve:
      keep-items: true
      keep-xp: true

  first-death:
    enabled: false
    keep-items: true
    keep-xp: true

  streak:
    enabled: false
    threshold: 3
    window-seconds: 300
    keep-items: false
    keep-xp: false

# =============================================================================
# 4 — Worlds (empty enabled = all worlds)
# =============================================================================
worlds:
  enabled: []
  # Optional per-world overrides (legacy day/night booleans = first two segments only).
  # Prefer: segments."<tick>" with keep-items / keep-xp matching a milestone "at".
  # overrides:
  #   world_nether:
  #     segments:
  #       "0":
  #         keep-items: false
  overrides: {}

# =============================================================================
# 5 — Broadcasts when the schedule segment changes (world-wide)
# =============================================================================
broadcast:
  enabled: true
  period-change: true
  permission: ""
  use-chat: true
  use-action-bar: false
  use-title: false
  sound:
    enabled: false
    day: "ENTITY_PLAYER_LEVELUP"
    night: "ENTITY_WITHER_SPAWN"

# =============================================================================
# 6 — Per-player death feedback (only the dying player)
# =============================================================================
death-feedback:
  enabled: true
  chat: true
  action-bar: false

# =============================================================================
# 7 — Integrations
# =============================================================================
integrations:
  lands:
    enabled: false
    override-lands: false
    in-own-land:
      keep-items: false
      keep-xp: false
    in-other-land:
      keep-items: false
      keep-xp: false
    wilderness:
      enabled: false
      use-death-cause: false
      keep-items: false
      keep-xp: false

  griefprevention:
    enabled: false
    in-own-claim:
      keep-items: true
      keep-xp: true
    in-other-claim:
      keep-items: false
      keep-xp: false
    wilderness:
      enabled: false
      use-death-cause: false
      keep-items: false
      keep-xp: false

  gravesx:
    enabled: false

  axgraves:
    enabled: false

  graves:
    fallback-on-fail: true

  worldguard:
    enabled: false
    in-own-region:
      keep-items: true
      keep-xp: true
    in-other-region:
      keep-items: false
      keep-xp: false
    wilderness:
      enabled: false
      keep-items: false
      keep-xp: false

  towny:
    enabled: false
    in-own-town:
      keep-items: true
      keep-xp: true
    in-other-town:
      keep-items: false
      keep-xp: false
    wilderness:
      enabled: false
      keep-items: false
      keep-xp: false

# =============================================================================
# 8 — MMOItems (protected NBT tags)
# =============================================================================
mmoitems:
  protected-tags: []

# =============================================================================
# 9 — Economy (Vault)
# =============================================================================
economy:
  enabled: false
  cost: 100.0
  mode: "charge-to-keep"
  gui:
    timeout: 30
    expire-time: 300

# =============================================================================
# 10 — Statistics
# =============================================================================
stats:
  enabled: true
